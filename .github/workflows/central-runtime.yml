name: Central Runtime 2026

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "central_runtime_snapshot.py"
      - "build_supporter_snapshot.py"
      - ".github/workflows/central-runtime.yml"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: central-runtime-2026
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pandas numpy gspread google-auth

      - name: Gerar Radar, território e apoiadores
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          RADAR_WORKSHEET: Radar_Politico
          HISTORICO_PATH: dados.csv
          ELEITORADO_2026_PATH: eleitorado_2026_ac.csv
          PERFIL_PATH: perfil_eleitorado_2026_ac.csv
          RESUMO_MUNICIPAL_PATH: resumo_municipal_2026_ac.csv
          RADAR_OUTPUT: radar_runtime.json
          PERFIL_OUTPUT: perfil_territorial_2026.json
          SUPPORTER_MIN_CELL: "10"
          SUPPORTER_SNAPSHOT_OUTPUT: apoiadores_agregado.json
        run: |
          python central_runtime_snapshot.py
          python build_supporter_snapshot.py

      - name: Empacotar runtime
        run: |
          mkdir -p central-runtime
          cp radar_runtime.json central-runtime/
          cp perfil_territorial_2026.json central-runtime/
          cp apoiadores_agregado.json central-runtime/

      - name: Publicar runtime consumido pela Central
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin central-runtime-data; then
            git fetch origin central-runtime-data
            git worktree add runtime-publish origin/central-runtime-data
            mkdir -p runtime-publish/runtime
            cp central-runtime/*.json runtime-publish/runtime/
            cd runtime-publish
            git add runtime/radar_runtime.json runtime/perfil_territorial_2026.json runtime/apoiadores_agregado.json
            if git diff --cached --quiet; then
              echo "Runtime já está atualizado."
            else
              git commit -m "Atualiza runtime da Central"
              git push origin HEAD:central-runtime-data
            fi
          else
            mkdir runtime-publish
            cp -R central-runtime runtime-publish/runtime
            cd runtime-publish
            git init
            git checkout -b central-runtime-data
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git add runtime/
            git commit -m "Cria runtime da Central"
            git push -u origin central-runtime-data
          fi
