name: Radar Politico 2026

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: radar-politico-2026
  cancel-in-progress: true

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests gspread google-auth

      - name: Executar Radar v8
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RADAR_WORKSHEET: Radar_Politico
          GEMINI_MODEL: gemini-3.7-flash
          RADAR_FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python radar_politico_v8.py
