name: Export Cloudflare Account ID

on:
  push:
    paths:
      - '.export-cf-account-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar identificador da conta
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" > /tmp/cloudflare-account-id.txt
      - name: Salvar artefato temporário
        uses: actions/upload-artifact@v4
        with:
          name: central-v6-cloudflare-account-id
          path: /tmp/cloudflare-account-id.txt
          retention-days: 1
          if-no-files-found: error
