name: Test Wrangler Token Only

on:
  push:
    paths:
      - '.token-only-test-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Testar autenticação Wrangler sem Account ID explícito
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p /tmp/cf-token-test
          printf '<!doctype html><title>token test</title><p>ok</p>' > /tmp/cf-token-test/index.html
          npx --yes wrangler@latest pages deploy /tmp/cf-token-test --project-name=central-samir-2026 --branch=token-only-test
